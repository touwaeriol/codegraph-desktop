[package]
name = "codegraph-desktop"
version = "0.1.5"
edition = "2021"

[lib]
name = "codegraph_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
toml_edit = "0.22"
sha2 = "0.10"
tempfile = "3"
which = "8"
dunce = "1"
# Match tauri-plugin-dialog's GTK backend; rfd defaults also enable xdg-portal.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
project-gateway = { path = "../crates/project-gateway" }
project-protocol = { path = "../crates/project-protocol" }
