[package]
name = "project-gateway"
version = "0.1.0"
edition = "2021"
[dependencies]
dunce = "1"
project-protocol = { path = "../project-protocol" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rmcp = { version = "=0.8.5", features = ["client", "server", "transport-async-rw", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "transport-io"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
url = "2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
